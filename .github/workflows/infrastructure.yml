name: Infrastructure CI

on:
  push:
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - '.github/workflows/infrastructure.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operacao de infraestrutura'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - configure
          - destroy
      instance_type:
        description: 'Tipo da instancia da aplicacao'
        required: true
        default: 't3.small'
        type: choice
        options:
          - t3.small
          - t3.medium

      update_os:
        description: 'Atualizar sistema operacional'
        required: true
        default: false
        type: boolean

      extra_packages:
        description: 'Pacotes adicionais separados por virgula'
        required: false
        default: ''
        type: string
      app_version:
        description: 'Hash da imagem para atualizar a aplicacao'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate temporary SSH key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/mensal4 -N ""

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Format
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Create validation inventory
        run: |
          printf '[application]\napp\n\n[database]\ndb\n' > ansible/inventory.ini

      - name: Ansible Syntax Check
        run: ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check

  infrastructure:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    env:
      AWS_PROFILE: mensal4
      TF_VAR_instance_type: ${{ inputs.instance_type }}
      UPDATE_OS: ${{ inputs.update_os }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      APP_VERSION: ${{ inputs.app_version }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Terraform variables
        run: |
          echo "TF_VAR_admin_cidr=$(curl -4 -fsS https://checkip.amazonaws.com)/32" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config="path=$HOME/.mensal4/terraform-state/terraform.tfstate"

      - name: Terraform Plan
        if: inputs.operation == 'plan' || inputs.operation == 'apply'
        run: terraform -chdir=terraform plan -out=mensal4.tfplan

      - name: Terraform Apply
        if: inputs.operation == 'apply'
        run: terraform -chdir=terraform apply mensal4.tfplan

      - name: Terraform Destroy
        if: inputs.operation == 'destroy'
        run: terraform -chdir=terraform destroy -auto-approve

      - name: Configure servers with Ansible
        if: inputs.operation == 'apply' || inputs.operation == 'configure'
        run: |
          APP_IP=$(terraform -chdir=terraform output -raw app_public_ip)
          DB_IP=$(terraform -chdir=terraform output -raw database_private_ip)
          VOLUME_ID=$(terraform -chdir=terraform output -raw mongodb_volume_id)

          cat > ansible/inventory.ini <<INVENTORY
          [application]
          app ansible_host=$APP_IP

          [database]
          db ansible_host=$DB_IP mongodb_volume_id=$VOLUME_ID ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=accept-new -i $HOME/.ssh/mensal4 -W %h:%p ubuntu@$APP_IP"'

          [all:vars]
          ansible_user=ubuntu
          ansible_ssh_extra_args="-o StrictHostKeyChecking=accept-new"
          ansible_ssh_private_key_file=$HOME/.ssh/mensal4
          INVENTORY

          export ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg"
          ansible all -i ansible/inventory.ini -m wait_for_connection -a "timeout=300"
          ansible-playbook -i ansible/inventory.ini ansible/site.yml \
          -e "update_os=$UPDATE_OS" \
          -e "extra_packages=$EXTRA_PACKAGES" \
          -e "app_version=$APP_VERSION"
