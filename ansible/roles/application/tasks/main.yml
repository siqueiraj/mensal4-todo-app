---
- name: Criar diretorio da aplicacao
  ansible.builtin.file:
    path: /opt/todo-app
    state: directory
    mode: '0755'

- name: Copiar frontend
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../frontend/"
    dest: /opt/todo-app/frontend/

- name: Copiar backend
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/"
    dest: /opt/todo-app/backend/

- name: Obter senha da aplicacao
  ansible.builtin.set_fact:
    mongo_app_password: "{{ lookup('ansible.builtin.ini', 'MONGO_APP_PASSWORD', type='properties', file=lookup('env', 'HOME') + '/.mensal4/database.env') }}"
  no_log: true

- name: Configurar conexao com MongoDB
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/application.env.j2"
    dest: /opt/todo-app/.env
    mode: '0600'
  no_log: true

- name: Configurar Docker Compose
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/application-compose.yml.j2"
    dest: /opt/todo-app/compose.yml
    mode: '0644'

- name: Verificar existencia de versao implantada
  ansible.builtin.stat:
    path: /opt/todo-app/.version
  register: deployed_version

- name: Construir e iniciar aplicacao inicial
  ansible.builtin.command:
    cmd: docker compose up -d --wait --wait-timeout 300
    chdir: /opt/todo-app
  register: app_compose
  changed_when: app_compose.stderr is search('Created|Recreated|Started|Built')
  when: not deployed_version.stat.exists
  no_log: true

- name: Verificar disponibilidade da API
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/todos
    status_code: 200

- name: Instalar script de deploy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/deploy.sh"
    dest: /opt/todo-app/deploy.sh
    owner: root
    group: root
    mode: '0700'

- name: Disponibilizar Docker Compose de producao
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/application-production.yml.j2"
    dest: /opt/todo-app/compose.production.yml
    mode: '0644'

- name: Validar versao solicitada
  ansible.builtin.assert:
    that:
      - app_version is match('^[a-f0-9]{40}$')
  when: app_version | default('') | length > 0

- name: Ler versao instalada
  ansible.builtin.command:
    cmd: cat /opt/todo-app/.version
  register: current_release
  changed_when: false
  when: deployed_version.stat.exists

- name: Atualizar imagens versionadas
  when:
    - app_version | default('') | length > 0
    - app_version != current_release.stdout | default('')
  block:
    - name: Autenticar no GHCR
      ansible.builtin.command:
        cmd: docker login ghcr.io -u {{ lookup('env', 'GITHUB_ACTOR') }} --password-stdin
        stdin: "{{ lookup('env', 'GHCR_TOKEN') }}"
      no_log: true
      changed_when: false

    - name: Implantar versao solicitada
      ansible.builtin.command:
        argv:
          - bash
          - /opt/todo-app/deploy.sh
          - "{{ app_version }}"
      environment:
        IMAGE_BASE: ghcr.io/siqueiraj/mensal4-todo-app

  always:
    - name: Encerrar autenticacao no GHCR
      ansible.builtin.command:
        cmd: docker logout ghcr.io
      changed_when: false

- name: Instalar Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar HTTPS
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/Caddyfile.j2"
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    validate: 'caddy validate --config %s --adapter caddyfile'
  register: caddy_config

- name: Iniciar servico Caddy
  ansible.builtin.systemd:
    name: caddy
    state: "{{ 'restarted' if caddy_config.changed else 'started' }}"
    enabled: true
