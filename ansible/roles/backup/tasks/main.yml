---
- name: Instalar cron
  ansible.builtin.apt:
    name: cron
    state: present

- name: Habilitar servico cron
  ansible.builtin.service:
    name: cron
    state: started
    enabled: true

- name: Instalar script de backup
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/backup.sh.j2"
    dest: /usr/local/bin/todo-backup.sh
    owner: root
    group: root
    mode: '0700'

- name: Agendar backup diario
  ansible.builtin.cron:
    name: Backup diario MongoDB
    user: root
    minute: "0"
    hour: "3"
    job: "/usr/local/bin/todo-backup.sh >> /var/log/todo-backup.log 2>&1"
